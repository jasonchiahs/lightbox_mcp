[project]
name = "lightbox-mcp"
version = "2.0.0"
description = "MCP server for the YANDING MLB-LHM V2.0 lightbox: top/up/down lights, rail and turntable"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pyserial>=3.5",
]

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
lightbox-mcp = "lightbox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lightbox_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Formatting/linting (PEP 8 based). The code is written to 120 columns.
[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
